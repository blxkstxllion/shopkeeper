name: shopkeeper

services:
  postgres:
    image: postgres:16-alpine
    container_name: shopkeeper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopkeeper
      POSTGRES_PASSWORD: shopkeeper_dev_password
      POSTGRES_DB: shopkeeper
    ports:
      # Host port 5433, not 5432: this machine already has a native PostgreSQL
      # service bound to 5432, and the two would otherwise silently collide.
      - "5433:5432"
    volumes:
      - shopkeeper-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopkeeper -d shopkeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shopkeeper-postgres-data:
