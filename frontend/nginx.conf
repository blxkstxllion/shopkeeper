server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Non-root Nginx can't write its default pid/temp paths under /var/run as configured
    # in the image; those are pre-chowned to the app user in the Dockerfile instead.

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Liveness probe for the Nginx process itself (Docker HEALTHCHECK) - deliberately
    # doesn't touch the api container, so a backend outage doesn't also mark the
    # frontend container unhealthy when it's still serving static assets fine.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Reverse-proxy API calls to the backend container so the browser sees a single
    # origin in every environment - no CORS configuration needed in production.
    #
    # proxy_pass targets a variable (not a bare hostname) so Nginx resolves "api" at
    # request time via Docker's embedded DNS (127.0.0.11), instead of once at config
    # load. With a bare hostname, Nginx refuses to start at all - taking down static
    # file serving too, not just this route - if the api container isn't already up
    # and DNS-registered the instant Nginx boots (a real ordering race, not
    # hypothetical: it reproduces if either container restarts independently).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # No URI component after $api_upstream (deliberately): the backend's own
        # routes already start with /api/..., matching what the browser requested,
        # so the request is passed through unchanged rather than rewritten - the
        # variable is only here to force runtime (not startup-time) DNS resolution.
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are immutable - cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must always be revalidated so deploys are picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
