name: Production

# main -> promote the *already-built* staging image (by digest, no rebuild) to an
# immutable production tag -> deploy that exact image.
#
# Assumption this relies on: main only ever advances by merging the tip of develop
# once that tip has been deployed to and validated in staging (see staging.yml) - so
# the `:develop` tag in GHCR at merge time is exactly the image that was tested.
# Don't push new commits to develop between opening and merging a release PR, or the
# `:develop` tag will have moved past what was actually validated.
on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/shopkeeper-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/shopkeeper-frontend

jobs:
  promote:
    name: Promote staging image to an immutable production tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag staging API image as ${{ steps.version.outputs.version }} (no rebuild)
        run: |
          docker buildx imagetools create \
            --tag "${{ env.API_IMAGE }}:${{ steps.version.outputs.version }}" \
            --tag "${{ env.API_IMAGE }}:latest" \
            "${{ env.API_IMAGE }}:develop"

      - name: Retag staging frontend image as ${{ steps.version.outputs.version }} (no rebuild)
        run: |
          docker buildx imagetools create \
            --tag "${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}" \
            --tag "${{ env.FRONTEND_IMAGE }}:latest" \
            "${{ env.FRONTEND_IMAGE }}:develop"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: promote
    environment: production
    # Skips (not fails) until a production host is actually configured - see
    # the root README's "Configuring a real staging/production target" section.
    if: vars.PRODUCTION_HOST != ''
    steps:
      - name: Deploy via SSH (pull the promoted image, recreate containers)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.PRODUCTION_HOST }}
          username: ${{ vars.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            export IMAGE_OWNER="${{ github.repository_owner }}"
            export API_IMAGE_TAG="${{ needs.promote.outputs.version }}"
            export FRONTEND_IMAGE_TAG="${{ needs.promote.outputs.version }}"
            cd /opt/shopkeeper
            # --env-file is explicit, not left to Compose's auto-discovery: the project
            # directory Compose infers .env from is derived from the -f paths (docker/),
            # not from cwd, so without this it can't find /opt/shopkeeper/.env at all -
            # a real bug this exact deploy path caught the first time it ever actually ran.
            docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml pull
            docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
            docker image prune -f
