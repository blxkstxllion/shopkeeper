name: Staging

# develop -> build immutable, versioned images -> push to GHCR -> deploy to staging.
# This never rebuilds from source on the staging server - it pulls exactly what was
# built and pushed here. Promotion to production (production.yml) reuses these same
# image digests rather than rebuilding again, so what's tested in staging is bit-for-bit
# what reaches production.
on:
  push:
    branches: [develop]

concurrency:
  group: staging-deploy
  cancel-in-progress: false # never cancel a deploy mid-flight

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/shopkeeper-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/shopkeeper-frontend

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api-tag: ${{ steps.tags.outputs.api-tag }}
      frontend-tag: ${{ steps.tags.outputs.frontend-tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tags
        run: |
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          echo "api-tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend-tag=$SHA_TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.tags.outputs.api-tag }}
            ${{ env.API_IMAGE }}:develop
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tags.outputs.frontend-tag }}
            ${{ env.FRONTEND_IMAGE }}:develop
          build-args: |
            VITE_API_BASE_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    # Skips (not fails) until a staging host is actually configured - see
    # the root README's "Configuring a real staging/production target" section.
    # A skipped deploy is reported as skipped, never as a false "success".
    if: vars.STAGING_HOST != ''
    steps:
      - name: Deploy via SSH (pull images, recreate containers)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: API_IMAGE,FRONTEND_IMAGE
          script: |
            set -e
            export IMAGE_OWNER="${{ github.repository_owner }}"
            export API_IMAGE_TAG="${{ needs.build-and-push.outputs.api-tag }}"
            export FRONTEND_IMAGE_TAG="${{ needs.build-and-push.outputs.frontend-tag }}"
            cd /opt/shopkeeper
            # --env-file is explicit, not left to Compose's auto-discovery: the project
            # directory Compose infers .env from is derived from the -f paths (docker/),
            # not from cwd, so without this it can't find /opt/shopkeeper/.env at all -
            # a real bug production.yml's identical script caught the first time it ever ran.
            docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml pull
            docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
            docker image prune -f
